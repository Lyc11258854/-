<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物汉堡店 - 暴怒厨房</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a0a00; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; }
#backBtn { position: fixed; top: 16px; left: 16px; z-index: 999; padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(0,0,0,0.5); color: #aaa; font-size: 13px; cursor: pointer; text-decoration: none; backdrop-filter: blur(4px); transition: 0.2s; }
#backBtn:hover { background: rgba(255,255,255,0.1); color: #fff; }
#app { width: 1000px; height: 700px; background: #4a3020; border-radius: 24px; position: relative; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; }

#topBar { height: 52px; background: #1a0a00; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #fff; flex-shrink: 0; }
#topBar .title { font-size: 18px; font-weight: bold; color: #fda; }
#topBar .stats { display: flex; gap: 16px; font-size: 13px; }
#topBar .stats span { background: rgba(255,255,255,0.08); padding: 4px 12px; border-radius: 8px; }

#main { display: flex; flex: 1; overflow: hidden; }

#customerPanel { width: 270px; background: #f5e6d0; padding: 14px; display: flex; flex-direction: column; align-items: center; }
#customerSprite { font-size: 68px; margin-bottom: 2px; }
#customerName { font-size: 16px; font-weight: bold; color: #3a2a1a; }
#customerTitle { font-size: 11px; color: #a98; margin-bottom: 4px; }
#moodBar { width: 100%; height: 7px; background: #ddd; border-radius: 4px; overflow: hidden; margin: 4px 0; }
#moodFill { height: 100%; background: linear-gradient(90deg,#f44,#fa0,#4f4); width: 100%; border-radius: 4px; transition: width 0.5s; }
#moodLabel { font-size: 10px; color: #888; margin-bottom: 4px; }
#speech { background: #fff; border: 2px solid #3a2a1a; border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 48px; font-size: 12px; color: #333; position: relative; margin: 4px 0; }
#speech:after { content:''; position:absolute; top:-10px; left:30px; border:5px solid transparent; border-bottom-color:#fff; border-top:0; }
#speech .speaker { font-weight: bold; color: #f44; font-size: 11px; }
#speech .text { line-height: 1.4; margin-top: 2px; }
#orderDisplay { background: #fff8ee; border: 2px dashed #c9a; border-radius: 10px; padding: 6px 10px; width: 100%; margin-top: 4px; text-align: center; }
#orderDisplay .label { font-size: 10px; color: #a98; }
#orderDisplay .items { font-size: 12px; color: #542; margin-top: 2px; min-height: 18px; }

#chatOptions { width: 100%; margin-top: 6px; display: none; flex-direction: column; gap: 4px; }
.chatBtn { padding: 6px 10px; border: 2px solid #c9a; border-radius: 8px; background: #fff; cursor: pointer; font-size: 11px; text-align: left; transition: 0.15s; color: #333; }
.chatBtn:hover { border-color: #f80; background: #fff8f0; }
.chatBtn .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px; color: #fff; }
.tag-nice { background: #4a4; }
.tag-neutral { background: #a80; }
.tag-rude { background: #c44; }

#burgerPanel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 12px; background: #3a2212; position: relative; }
#burgerTitle { font-size: 12px; color: #b98; margin-bottom: 4px; }
#burgerVisual { display: flex; flex-direction: column-reverse; align-items: center; width: 240px; min-height: 310px; justify-content: flex-start; margin-bottom: 6px; }
.bLayer { width: 200px; flex-shrink: 0; position: relative; }

.bunB-layer { height: 28px; margin-bottom: 0; }
.bunB-layer svg { width: 100%; height: 100%; }
.patty-layer { height: 26px; }
.patty-layer svg { width: 100%; height: 100%; }
.bacon-layer { height: 14px; }
.bacon-layer svg { width: 100%; height: 100%; }
.cheese-layer { height: 16px; }
.cheese-layer svg { width: 100%; height: 100%; }
.onion-layer { height: 14px; }
.onion-layer svg { width: 100%; height: 100%; }
.lettuce-layer { height: 18px; }
.lettuce-layer svg { width: 100%; height: 100%; }
.tomato-layer { height: 16px; }
.tomato-layer svg { width: 100%; height: 100%; }
.sauce-layer { height: 12px; }
.sauce-layer svg { width: 100%; height: 100%; }
.bunT-layer { height: 34px; }
.bunT-layer svg { width: 100%; height: 100%; }

#burgerActions { display: flex; gap: 8px; margin-top: 4px; }
#submitBtn { padding: 10px 36px; border: none; border-radius: 12px; background: linear-gradient(135deg,#f80,#f44); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.15s; }
#submitBtn:disabled { opacity: 0.3; cursor: not-allowed; }
#clearBtn { padding: 10px 20px; border: none; border-radius: 12px; background: #554; color: #ccc; font-size: 14px; cursor: pointer; }

#ingredientPanel { width: 190px; background: #2a1a0a; padding: 10px; display: flex; flex-direction: column; }
#ingredientPanel h3 { color: #fda; font-size: 12px; margin-bottom: 6px; }
#ingredientList { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
.ingBtn { padding: 5px 6px; border: 2px solid #5a4a3a; border-radius: 6px; background: #4a3a2a; color: #fff; cursor: pointer; font-size: 11px; text-align: center; transition: 0.15s; }
.ingBtn:hover { background: #5a4a3a; border-color: #fda; }
.ingBtn:active { transform: scale(0.95); }
.ingBtn .emoji { font-size: 16px; display: block; }

#dayEnd { position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.7); z-index:50; display:none; align-items:center; justify-content:center; }
#dayEndBox { background:#2a1a0a; border-radius:24px; padding:28px 36px; text-align:center; max-width:400px; color:#fff; }
#dayEndBox h2 { font-size:26px; margin-bottom:4px; }
#dayEndBox .sub { color:#a98; font-size:13px; margin-bottom:12px; }
#dayEndBox .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; }
#dayEndBox .total { font-size:20px; color:#fd0; margin:10px 0; }
#dayEndBox .eval { background:rgba(255,255,255,0.06); border-radius:10px; padding:10px; margin:10px 0; font-size:13px; color:#fda; }
#dayEndBox button { padding:10px 36px; border:none; border-radius:12px; background:linear-gradient(135deg,#f80,#f44); color:#fff; font-size:15px; cursor:pointer; margin-top:4px; }

#startScreen { position:absolute; top:0;left:0;right:0;bottom:0; background:linear-gradient(135deg,#2a1a0a,#4a2a1a); z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
#startScreen h1 { font-size:46px; margin-bottom:4px; }
#startScreen .sub { color:#fda; font-size:14px; margin-bottom:4px; }
#startScreen .flavor { color:#a98; font-size:12px; max-width:360px; text-align:center; margin-bottom:18px; }
#startBtnMain { padding:14px 56px; border:none; border-radius:16px; background:linear-gradient(135deg,#f80,#f44); color:#fff; font-size:20px; font-weight:bold; cursor:pointer; transition:0.2s; }
#startBtnMain:hover { transform:scale(1.05); }
#backBtn { position:fixed; top:16px; left:16px; z-index:999; padding:6px 14px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(0,0,0,0.5); color:#aaa; font-size:13px; cursor:pointer; text-decoration:none; backdrop-filter:blur(4px); transition:0.2s; }
#backBtn:hover { background:rgba(255,255,255,0.1); color:#fff; }
</style>
</head>
<body>
<a id="backBtn" href="index.html">← 大厅</a>
<div id="app">

  <div id="topBar">
    <div class="title">🍔 暴怒汉堡</div>
    <div class="stats">
      <span>📅 第 <b id="dayNum">1</b> 天</span>
      <span>👤 <b id="customerNum">0</b>/5</span>

  </div>

  <div id="main">
    <div id="customerPanel">
      <div id="customerSprite">🐱</div>

      <div id="moodBar"><div id="moodFill"></div></div>
      <div id="moodLabel">😄 耐心 100%</div>
      <div id="speech">
        <div class="speaker"><span id="speechSpeaker">🐱 猫小咪</span></div>

      <div id="orderDisplay">

        <button id="submitBtn" disabled>🍔 出餐</button>
        <button id="clearBtn">🗑 重做</button>

    <div id="ingredientPanel">

      <div id="ingredientList"></div>
    </div>
  </div>

  <div id="dayEnd">
    <div id="dayEndBox">
      <h2>📊 打烊</h2>
      <div class="sub" id="dayEndSub">第 1 天</div>
      <div class="row"><span>🍔 完成</span><span id="deOrders">0/5</span></div>
      <div class="row"><span>⭐ 均分</span><span id="deRating">0.0</span></div>
      <div class="row"><span>💰 日收</span><span id="deIncome">0</span></div>
      <div class="total">💰 总资产: <span id="deTotal">0</span></div>
      <div class="eval" id="deEval"></div>
      <button onclick="nextDay()">📅 下一天</button>
    </div>
  </div>

  <div id="startScreen">
    <h1>🍔 暴怒汉堡</h1>
    <div class="sub">动物界最黑暗的料理摊</div>
    <div class="flavor">5 个恶劣客人 · 身份各异 · 耐心有限<br>汉堡做太慢？等着被喷成筛子吧。</div>
    <button id="startBtnMain" onclick="startGame()">🔥 开始受罪</button>
  </div>
</div>

// ============ STATE ============
let state = {
  day:1, money:0, customerIndex:0,
  dailyIncome:0, completedOrders:0, totalOrders:5, ratings:[],
  currentCustomer:null, currentOrder:[], burger:[],
  phase:'start', mood:100, maxMood:100,
  orderStartTime:0, submitted:false,
  usedChatIndices:[],
};
let moodInterval = null;

const $=id=>document.getElementById(id);
const ingredientList=$('ingredientList');
const burgerVisual=$('burgerVisual');
const submitBtn=$('submitBtn');
const clearBtn=$('clearBtn');
const orderItems=$('orderItems');
const speechText=$('speechText');
const customerSprite=$('customerSprite');
const customerName=$('customerName');
const customerTitle=$('customerTitle');
const moodFill=$('moodFill');
const moodLabel=$('moodLabel');
const chatOptions=$('chatOptions');
const dayNum=$('dayNum');
const customerNum=$('customerNum');
const moneyDisplay=$('moneyDisplay');
const dayEnd=$('dayEnd');
const dayEndSub=$('dayEndSub');
const deOrders=$('deOrders');
const deRating=$('deRating');
const deIncome=$('deIncome');
const deTotal=$('deTotal');
const deEval=$('deEval');

function renderIngredients() {
  ingredientList.innerHTML = '';
  for (const id of INGREDIENT_LIST) {
    const d = INGREDIENT_DATA[id];
    const btn = document.createElement('div');
    btn.className = 'ingBtn';
    btn.innerHTML = `<span class="emoji">${d.emoji}</span>${d.name}`;
    btn.onclick = () => addIngredient(id);
    ingredientList.appendChild(btn);
  }
}

function addIngredient(id) {
  if (state.phase!=='playing' || state.submitted) return;
  state.burger.push(id);
  renderBurgerVisual();
  validateBurger();
}

function renderBurgerVisual() {
  if (!state.burger.length) {
    burgerVisual.innerHTML = '<div style="color:#b98;font-size:14px;padding:40px 0;text-align:center;">🍔 点击右侧食材<br>开始制作</div>';
    return;
  }
  const sorted = [...state.burger].sort((a,b)=>LAYER_ORDER.indexOf(a)-LAYER_ORDER.indexOf(b));
  let html = '';
  for (const id of sorted) {
    const d = INGREDIENT_DATA[id];
    if (!d) continue;
    html += `<div class="bLayer ${d.cls}">${d.svg()}</div>`;
  }
  burgerVisual.innerHTML = html;
}

function validateBurger() {
  const s = state.burger;
  submitBtn.disabled = !(s.includes('bunB') && s.includes('bunT') && s.includes('patty'));
}

clearBtn.onclick = () => {
  if (state.phase!=='playing' || state.submitted) return;
  state.burger = []; renderBurgerVisual(); submitBtn.disabled = true;
};

function generateOrder() {
  const extras = ['lettuce','tomato','cheese','onion','bacon','sauce'];
  const num = 2 + Math.floor(Math.random()*3);
  const picked = extras.sort(()=>Math.random()-0.5).slice(0,num);
  return [...picked, 'bunB','patty','bunT'];
}

function renderOrder() {
  const names = state.currentOrder.map(id => {
    const d = INGREDIENT_DATA[id];
    return d ? `${d.emoji}${d.name}` : id;
  });
  orderItems.textContent = names.join(' · ');
}

function pickCustomer() { return CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)]; }
function randomLine(a) { return a[Math.floor(Math.random()*a.length)]; }
function setSpeech(text) { speechText.textContent = text; }

function updateMood() {
  const p = Math.max(0, state.mood);
  moodFill.style.width = p + '%';
  const e = p>66?'😄':(p>33?'😐':'😤');
  moodLabel.textContent = `${e} 耐心 ${Math.floor(p)}%`;
}

function startMoodTimer() {
  if (moodInterval) clearInterval(moodInterval);
  state.mood = state.maxMood;
  state.orderStartTime = Date.now();
  state.submitted = false;
  state.usedChatIndices = [];
  moodInterval = setInterval(() => {
    if (state.phase!=='playing' || state.submitted) return;
    const elapsed = (Date.now()-state.orderStartTime)/1000;
    const c = state.currentCustomer;
    state.mood = Math.max(0, 100 - (elapsed/c.patience)*100);
    updateMood();
    if (state.mood<30 && state.mood>28) {
      setSpeech(randomLine(c.mood_low));
    }
    if (state.mood<=0) {
      clearInterval(moodInterval);
      chatOptions.style.display='none';
      setSpeech('不等了！我走了！垃圾店！');
      setTimeout(() => {
        if (!state.submitted) {
          state.ratings.push(0);
          state.customerIndex++;
          updateUI();
          state.customerIndex>=state.totalOrders ? endDay() : setTimeout(()=>nextCustomer(),1200);
        }
      },1500);
    }
  },200);
}

// ============ CHAT SYSTEM ============
function showChatOptions() {
  const c = state.currentCustomer;
  if (!c || state.phase!=='playing' || state.submitted) return;
  chatOptions.style.display = 'flex';
  chatOptions.innerHTML = '';

  const pool = c.chats.filter((_,i)=>!state.usedChatIndices.includes(i));
  if (pool.length < 3) state.usedChatIndices = [];

  const available = c.chats.filter((_,i)=>!state.usedChatIndices.includes(i));
  const picked = [];
  const indices = [];
  const shuffled = [...Array(available.length).keys()].sort(()=>Math.random()-0.5);
  for (let i=0; i<Math.min(3, available.length); i++) {
    picked.push(available[shuffled[i]]);
    indices.push(c.chats.indexOf(available[shuffled[i]]));
  }

  for (const opt of picked) {
    const btn = document.createElement('button');
    btn.className = 'chatBtn';
    const tagClass = opt.tag==='nice'?'tag-nice':(opt.tag==='rude'?'tag-rude':'tag-neutral');
    btn.innerHTML = `<span class="tag ${tagClass}">${opt.tag==='nice'?'好话':(opt.tag==='rude'?'狠话':'闲聊')}</span>${opt.text}`;
    btn.onclick = () => {
      const idx = c.chats.indexOf(opt);
      if (!state.usedChatIndices.includes(idx)) state.usedChatIndices.push(idx);
      chatOptions.style.display = 'none';
      setSpeech(`«${opt.text}»`);
      setTimeout(() => {
        setSpeech(opt.reply);
        setTimeout(() => showChatOptions(), 1200);
      }, 500);
    };
    chatOptions.appendChild(btn);
  }
}

// ============ GAME FLOW ============
function nextCustomer() {
  if (state.customerIndex>=state.totalOrders) { endDay(); return; }
  state.currentCustomer = pickCustomer();
  state.currentOrder = generateOrder();
  state.burger = [];
  state.phase = 'playing';
  state.submitted = false;
  state.usedChatIndices = [];
  if (moodInterval) clearInterval(moodInterval);

  customerSprite.textContent = state.currentCustomer.emoji;
  customerName.textContent = state.currentCustomer.name;
  customerTitle.textContent = state.currentCustomer.title;
  renderOrder();
  renderBurgerVisual();
  validateBurger();
  updateUI();
  setSpeech(randomLine(state.currentCustomer.greet));
  startMoodTimer();
  updateMood();
  setTimeout(() => showChatOptions(), 800);
}

// ============ SUBMIT ============
submitBtn.onclick = () => submitOrder();
function submitOrder() {
  if (submitBtn.disabled || state.submitted) return;
  state.submitted = true;
  if (moodInterval) clearInterval(moodInterval);
  chatOptions.style.display = 'none';

  const c = state.currentCustomer;
  const sp = [...state.burger].sort((a,b)=>LAYER_ORDER.indexOf(a)-LAYER_ORDER.indexOf(b));
  const so = [...state.currentOrder].sort((a,b)=>LAYER_ORDER.indexOf(a)-LAYER_ORDER.indexOf(b));

  let correct = sp.length===so.length;
  if (correct) for (let i=0;i<sp.length;i++) if (sp[i]!==so[i]) { correct=false; break; }

  const moodBonus = Math.floor(state.mood/20);
  const revenue = correct ? (15+moodBonus+Math.floor(Math.random()*8)) : 3;
  const rating = correct ? Math.min(5,1+moodBonus) : 0;

  state.money += revenue;
  state.dailyIncome += revenue;
  if (correct) state.completedOrders++;
  state.ratings.push(rating);

  setSpeech(correct ? randomLine(c.correct) : randomLine(c.wrong));

  setTimeout(() => {
    setSpeech(`${correct?'✅ 完成！':'❌ 搞砸了...'} 收了 ${revenue} 元`);
  }, 600);

  setTimeout(() => {
    state.customerIndex++;
    updateUI();
    state.customerIndex>=state.totalOrders ? endDay() : (setSpeech('下一位客人来了...'), setTimeout(()=>nextCustomer(),1200));
  }, 2000);
}

// ============ DAY END ============
function endDay() {
  state.phase='end';
  if (moodInterval) clearInterval(moodInterval);
  chatOptions.style.display='none';
  dayEnd.style.display='flex';
  const avg = state.ratings.length ? state.ratings.reduce((a,b)=>a+b,0)/state.ratings.length : 0;
  dayEndSub.textContent=`第 ${state.day} 天 · 打烊结算`;
  deOrders.textContent=`${state.completedOrders}/${state.totalOrders}`;
  deRating.textContent=avg.toFixed(1);
  deIncome.textContent=`${state.dailyIncome} 元`;
  deTotal.textContent=state.money;
  const c = CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
  deEval.textContent = avg>=4 ? c.eval_high : (avg>=2 ? c.eval_mid : c.eval_low);
}

function nextDay() {
  state.day++; state.customerIndex=0; state.dailyIncome=0;
  state.completedOrders=0; state.ratings=[]; state.phase='playing';
  dayEnd.style.display='none'; updateUI(); nextCustomer();
}

function updateUI() {
  dayNum.textContent=state.day;
  customerNum.textContent=state.customerIndex;
  moneyDisplay.textContent=state.money;
}

function startGame() {
  document.getElementById('startScreen').style.display='none';
  state.phase='playing'; renderIngredients(); updateUI(); nextCustomer();
}
</script>
