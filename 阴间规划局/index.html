<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阴间规划局</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{overflow:hidden;background:#000;font-family:'STKaiti','KaiTi','STSong','SimSun',serif;color:#e8d5b0}
#game-container{width:100vw;height:100vh;position:relative}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a12;z-index:1000;transition:opacity .8s}
#loading.hidden{opacity:0;pointer-events:none}
#loading .title{font-size:3vw;color:#e8d5b0;letter-spacing:.3em;text-shadow:0 0 30px rgba(200,160,100,.3)}
#loading .bar-wrap{width:20vw;height:3px;background:#1a1a2e;border-radius:2px;overflow:hidden;margin-top:2vh}
#loading .bar{height:100%;width:0;background:linear-gradient(90deg,#e8d5b0,#ffd700);border-radius:2px}

#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

#top-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5vh 2vw;background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,transparent 100%)}
#score-display{font-size:1.6vw;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.3)}
#score-display span{font-size:.85vw;color:#887;margin-right:.3vw}
#soul-counter{font-size:1vw;color:#998;letter-spacing:.1em}
#soul-counter b{color:#e8d5b0}
#mid-bar{display:flex;align-items:center;gap:2vw}
#top-bar .title-tag{font-size:.75vw;padding:.2vh .6vw;border:1px solid rgba(200,160,100,.3);border-radius:2px;color:#cba;letter-spacing:.1em}
#top-bar .balance{font-size:.75vw;color:#887}

/* convo panel */
#panel{position:absolute;bottom:0;left:0;right:0;padding:1.2vw 2vw 1.8vw;background:linear-gradient(0deg,rgba(10,8,15,.97) 60%,transparent 100%);opacity:0;transition:opacity .5s;pointer-events:none}
#panel.show{opacity:1;pointer-events:auto}
#panel .soul-info{display:flex;align-items:center;gap:.8vw;margin-bottom:.8vh}
#panel .soul-info .name{font-size:1.5vw;color:#e8d5b0}
#panel .soul-info .age{font-size:.85vw;color:#776}
#panel .soul-info .title{font-size:.85vw;color:#998;margin-left:.3vw}
#panel .btns{display:flex;gap:.5vw;flex-wrap:wrap;align-items:center}
#panel .btns button{padding:.5vh 1.1vw;font-size:.85vw;font-family:inherit;background:transparent;border:1px solid rgba(200,160,100,.25);color:#cba;border-radius:3px;cursor:pointer;transition:all .3s;white-space:nowrap}
#panel .btns button:hover{background:rgba(200,160,100,.1);border-color:rgba(200,160,100,.5);color:#e8d5b0}
#panel .btns button.judge{background:rgba(200,60,60,.15);border-color:#c44;color:#e86}
#panel .btns button.judge:hover{background:rgba(200,60,60,.25);border-color:#e44}
#panel .btns button:disabled{opacity:.3;cursor:default}
#panel .btns button.voice-btn{border-color:rgba(100,150,255,.3);color:#88b}
#panel .btns button.voice-btn.active{border-color:#448;color:#88f;background:rgba(100,150,255,.1)}

/* skill bar */
#skill-bar{position:fixed;bottom:14vh;left:50%;transform:translateX(-50%);display:flex;gap:.5vw;padding:.5vw 1vw;background:rgba(10,8,15,.85);border:1px solid rgba(200,160,100,.15);border-radius:4px;opacity:0;transition:opacity .5s;z-index:8;pointer-events:none}
#skill-bar.show{opacity:1;pointer-events:auto}
.skill-item{display:flex;align-items:center;gap:.3vw;padding:.3vh .6vw;border:1px solid rgba(200,160,100,.15);border-radius:3px;font-size:.75vw;color:#998;transition:all .3s;cursor:pointer}
.skill-item.active{border-color:#ffd700;color:#ffd700;background:rgba(255,215,0,.1);box-shadow:0 0 15px rgba(255,215,0,.1)}
.skill-item .key{color:#665;margin-right:.2vw}
.skill-item .count{color:#665;margin-left:.3vw}
.skill-item.used{opacity:.3}

#skill-hint{position:fixed;bottom:10.5vh;left:50%;transform:translateX(-50%);font-size:.7vw;color:#443;letter-spacing:.05em;opacity:0;transition:opacity .5s;z-index:5}
#skill-hint.show{opacity:1}

/* start/end screens */
#start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);z-index:100;transition:opacity .8s}
#start-screen.hidden{opacity:0;pointer-events:none}
#start-screen h1{font-size:4.5vw;color:#e8d5b0;letter-spacing:.4em;margin-bottom:1vh;font-weight:400;text-shadow:0 0 40px rgba(200,160,100,.2);animation:titleFlicker 2.5s ease-in-out infinite}
@keyframes titleFlicker{0%,100%{opacity:1;text-shadow:0 0 40px rgba(200,160,100,.2)}25%{opacity:.5;text-shadow:0 0 10px rgba(200,160,100,.05)}50%{opacity:1;text-shadow:0 0 50px rgba(200,160,100,.35)}75%{opacity:.3;text-shadow:0 0 5px rgba(200,160,100,0)}}
.lantern{font-size:5vw;margin-bottom:-.5vh;animation:lanternFlicker 2.5s ease-in-out infinite;display:block;text-align:center;filter:drop-shadow(0 0 15px rgba(255,100,50,.5))}
@keyframes lanternFlicker{0%,100%{opacity:1;filter:drop-shadow(0 0 20px rgba(255,100,50,.6))}25%{opacity:.4;filter:drop-shadow(0 0 5px rgba(255,100,50,.1))}50%{opacity:1;filter:drop-shadow(0 0 30px rgba(255,100,50,.7))}75%{opacity:.2;filter:drop-shadow(0 0 3px rgba(255,100,50,0))}}
#start-screen .sub{font-size:1.1vw;color:#776;letter-spacing:.2em;margin-bottom:1.5vh;animation:titleBlood 4s ease-in-out infinite alternate}
@keyframes titleBlood{0%{color:transparent;text-shadow:0 0 0 transparent}30%{color:#fff;text-shadow:0 0 20px rgba(255,255,255,.3)}60%{color:#fff;text-shadow:0 0 20px rgba(255,255,255,.3)}100%{color:#f44;text-shadow:0 0 30px rgba(255,50,50,.5)}}
.blood-drip{position:absolute;top:100%;left:0;width:100%;height:0;pointer-events:none;overflow:visible}
.blood-drop{position:absolute;width:3px;background:linear-gradient(180deg,#c22,transparent);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;opacity:.7;animation:drip 2s ease-in infinite}
.blood-drop:nth-child(1){left:15%;height:18px;animation-delay:0s}
.blood-drop:nth-child(2){left:35%;height:12px;animation-delay:.6s}
.blood-drop:nth-child(3){left:55%;height:22px;animation-delay:1.2s}
.blood-drop:nth-child(4){left:75%;height:8px;animation-delay:.4s}
.blood-drop:nth-child(5){left:90%;height:15px;animation-delay:1.8s}
.blood-drop:nth-child(6){left:5%;height:10px;animation-delay:.9s}
.blood-drop:nth-child(7){left:45%;height:20px;animation-delay:1.5s}
.blood-drop:nth-child(8){left:65%;height:6px;animation-delay:.3s}
@keyframes drip{0%{transform:translateY(0) scaleY(1);opacity:.7}80%{opacity:.7}100%{transform:translateY(4vh) scaleY(1.5);opacity:0}}
#start-screen .host{font-size:.85vw;color:#554;max-width:34vw;text-align:center;line-height:1.8;margin-bottom:2vh}
#start-btn{padding:1.2vh 3vw;font-size:1.3vw;font-family:inherit;letter-spacing:.2em;background:transparent;color:#e8d5b0;border:1px solid rgba(200,160,100,.4);cursor:pointer;transition:all .3s;border-radius:2px}
#start-btn:hover{background:rgba(200,160,100,.1);border-color:#e8d5b0}

#end-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:100;transition:opacity .8s;opacity:0;pointer-events:none}
#end-screen.visible{opacity:1;pointer-events:auto}
#end-screen h1{font-size:2.8vw;color:#e8d5b0;letter-spacing:.3em;margin-bottom:1.5vh;font-weight:400}
#end-screen .stats{display:flex;gap:2.5vw;margin-bottom:1.5vh}
#end-screen .stat-item{text-align:center}
#end-screen .stat-item .num{font-size:2.5vw;color:#ffd700}
#end-screen .stat-item .label{font-size:.85vw;color:#887;margin-top:.4vh}
#end-screen .rank{font-size:1.5vw;color:#cba;margin-bottom:1.5vh}
#end-screen .soul-review{margin-bottom:2vh;font-size:.85vw;color:#665;line-height:1.8;max-width:40vw;text-align:center}
#end-screen .progress{font-size:.85vw;color:#887;margin-bottom:1.5vh}
#end-screen .progress span{color:#ffd700}
#restart-btn{padding:1.2vh 3vw;font-size:1.3vw;font-family:inherit;letter-spacing:.2em;background:transparent;color:#e8d5b0;border:1px solid rgba(200,160,100,.4);cursor:pointer;transition:all .3s;border-radius:2px}
#restart-btn:hover{background:rgba(200,160,100,.1);border-color:#e8d5b0}

#fire-eyes-overlay{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center;opacity:0;transition:opacity .4s}
#fire-eyes-overlay.show{opacity:1}
#fire-eyes-overlay .fe-title{font-size:.8vw;color:#ff6;letter-spacing:.15em;text-shadow:0 0 15px rgba(255,255,100,.4)}
#fire-eyes-overlay .fe-line{font-size:.9vw;color:#e8d5b0;margin-top:.3vh}
#fire-eyes-overlay .fe-line.fe-desire{color:#ffd700}
#fire-eyes-overlay .fe-line.fe-deserved{color:#f88}

#fulfill-btn{background:rgba(255,215,0,.12)!important;border-color:#ffd700!important;color:#ffd700!important}
#fulfill-btn:hover{background:rgba(255,215,0,.25)!important}
#divine-btn{background:rgba(150,100,255,.12)!important;border-color:#a6f!important;color:#d6f!important}
#divine-btn:hover{background:rgba(150,100,255,.25)!important}

/* feedback */
#feedback{position:fixed;top:8%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;text-align:center}
#feedback .main{font-size:2.8vw;font-weight:700;opacity:0;transition:all .6s}
#feedback .sub{font-size:1.1vw;color:#ba9;opacity:0;transition:all .6s .2s}
#feedback.show .main{opacity:1;transform:translateY(-1vh)}
#feedback.show .sub{opacity:1}
#feedback .main.happy{color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.5)}
#feedback .main.sad{color:#f66;text-shadow:0 0 30px rgba(255,50,50,.4)}
#feedback .main.tip{color:#ff6;text-shadow:0 0 40px rgba(255,255,100,.6)}

/* coin fly */
.coin-fly{position:fixed;pointer-events:none;z-index:15;font-size:2vw;opacity:0;animation:coinUp 1s forwards}
@keyframes coinUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20vh) scale(1.5)}}

/* soul 3D bubble */
.soul-bubble{background:rgba(8,6,12,.92);border:1px solid rgba(200,160,100,.25);border-radius:6px;padding:.5vw .9vw;max-width:14vw;min-width:6vw;text-align:center;pointer-events:none;box-shadow:0 0 30px rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.soul-bubble .sb-text{font-size:.85vw;line-height:1.5;color:#e0d0b8;white-space:normal;word-break:break-word;font-family:'STKaiti','KaiTi','STSong','SimSun',serif}
.soul-bubble .sb-speaker{font-size:.6vw;color:#665;margin-top:.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soul-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(8,6,12,.92)}
</style>
</head>
<body>

<div id="loading">
  <div class="title">阴 间 规 划 局</div>
  <div class="bar-wrap"><div class="bar" id="load-bar"></div></div>
</div>

<div id="start-screen">
  <div class="lantern">🏮</div>
  <h1>阴 间 规 划 局</h1>
  <div class="sub" style="position:relative;display:inline-block">
    — 死后办事处 · 新官上任 —
    <div class="blood-drip">
      <div class="blood-drop"></div><div class="blood-drop"></div><div class="blood-drop"></div>
      <div class="blood-drop"></div><div class="blood-drop"></div><div class="blood-drop"></div>
      <div class="blood-drop"></div><div class="blood-drop"></div>
    </div>
  </div>
  <div class="host">
    每轮接待 <b>5位亡灵</b>，和它们聊天、用法器问话，<br>
    然后送它们去该去的地方。<br>
    亡灵满意会打赏<b>冥币</b>，不满意也得照办。<br>
    按 <b>E</b> 切换法器 · 点击灵魂使用 · 🔊 语音朗读
  </div>
  <div class="host" id="title-display" style="color:#cba;margin-bottom:1vh"></div>
  <button id="start-btn">开 始 接 待</button>
</div>

<div id="end-screen">
  <h1>工 作 结 束</h1>
  <div class="rank" id="final-rank"></div>
  <div class="stats">
    <div class="stat-item"><div class="num" id="final-score">0</div><div class="label">冥 币</div></div>
    <div class="stat-item"><div class="num" id="final-happy">0</div><div class="label">满 意 数</div></div>
    <div class="stat-item"><div class="num" id="final-skills">0</div><div class="label">用 过 法 器</div></div>
  </div>
  <div class="soul-review" id="final-review"></div>
  <div class="progress" id="final-progress"></div>
  <button id="restart-btn">再 来 一 轮</button>
  <button id="exit-btn" style="display:none;margin-top:1vh;padding:.6vh 1.5vw;font-size:.85vw;font-family:inherit;letter-spacing:.1em;background:transparent;color:#887;border:1px solid rgba(200,160,100,.2);cursor:pointer;border-radius:2px">← 退出到简介</button>
</div>

<div id="game-container">
  <div id="ui">
    <div id="top-bar">
      <div id="score-display"><span>冥 币</span><span id="score-val">0</span></div>
      <div id="mid-bar">
        <div id="soul-counter"><span id="soul-num">0</span>/5 亡灵</div>
      </div>
      <div style="display:flex;align-items:center;gap:1vw;font-size:.85vw;color:#887">
        <span id="title-tag"></span>
        <span>余额：<b id="balance-val" style="color:#ffd700">0</b></span>
        <span>按 E 用法器</span>
      </div>
    </div>

    <div id="skill-bar">
      <div class="skill-item active" data-skill="0"><span class="key">E</span>糯米<span class="count" id="c0">×3</span></div>
      <div class="skill-item" data-skill="1"><span class="key">E</span>玉佩<span class="count" id="c1">×2</span></div>
      <div class="skill-item" data-skill="2"><span class="key">E</span>桃木剑<span class="count" id="c2">×1</span></div>
    </div>
    <div id="skill-hint">点击灵魂使用法器 · 再次按 E 切换</div>

    <!-- CSS2D bubble rendered in 3D space above soul -->

    <div id="panel">
      <div class="soul-info">
        <span class="name" id="soul-name"></span>
        <span class="age" id="soul-age"></span>
        <span class="title" id="soul-title"></span>
      </div>
      <div class="btns" id="question-btns"></div>
    </div>

    <div id="feedback">
      <div class="main" id="fb-main"></div>
      <div class="sub" id="fb-sub"></div>
    </div>

    <div id="fire-eyes-overlay">
      <div class="fe-title">🔥 火眼金睛</div>
      <div class="fe-line" id="fe-desire">心愿：—</div>
      <div class="fe-line" id="fe-deserved">应得：—</div>
      <div class="fe-line" id="fe-hint" style="font-size:.7vw;color:#665;margin-top:.4vh"></div>
    </div>

  </div>
</div>

<script type="importmap">

const HR = 1.05, HDIST = 2.8;

function makeGlowTex(color, intensity=.3){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  const r=color.r*255|0, g2=color.g*255|0, b=color.b*255|0;
  g.addColorStop(0,`rgba(${r},${g2},${b},${intensity})`);
  g.addColorStop(.5,`rgba(${r},${g2},${b},${intensity*.3})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

  sprite.scale.set(2,2,1); sprite.position.y=.05;

    color, emissive: color, emissiveIntensity: .25,
    transparent: true, opacity: .7, roughness: .3, metalness: .1,
  });

  // Shape variety
  const shapes=[
    {hs:.2,bs:.15,bt:.22,bh:.4,rw:.3,rt:.45,rh:.45,as:.035,al:.25,tw:.18,th:.25,ey:.75,by:.42,ry:.28,ay:.6,ty:.08},
    {hs:.18,bs:.2,bt:.28,bh:.35,rw:.35,rt:.5,rh:.5,as:.04,al:.22,tw:.22,th:.2,ey:.7,by:.38,ry:.25,ay:.55,ty:.05},
    {hs:.22,bs:.1,bt:.16,bh:.45,rw:.25,rt:.38,rh:.4,as:.03,al:.28,tw:.14,th:.3,ey:.8,by:.48,ry:.32,ay:.65,ty:.12},
    {hs:.17,bs:.18,bt:.25,bh:.3,rw:.32,rt:.48,rh:.35,as:.038,al:.2,tw:.2,th:.22,ey:.65,by:.35,ry:.22,ay:.5,ty:.06},
    {hs:.21,bs:.22,bt:.3,bh:.38,rw:.4,rt:.55,rh:.52,as:.042,al:.2,tw:.26,th:.18,ey:.78,by:.4,ry:.28,ay:.58,ty:.04},
    {hs:.16,bs:.08,bt:.14,bh:.42,rw:.2,rt:.32,rh:.38,as:.028,al:.3,tw:.12,th:.28,ey:.75,by:.48,ry:.32,ay:.65,ty:.14},
  ];
  const s=shapes[variant%shapes.length];

  // Head (slightly elongated for better proportion)
  const head = new THREE.Mesh(new THREE.SphereGeometry(s.hs, 10, 12), bodyMat);
  head.scale.y = 1.1;
  head.position.y = s.ey; g.add(head);

  // Neck
  const neckMat = bodyMat.clone(); neckMat.opacity = .5;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(s.hs*.25, s.hs*.3, s.hs*.15, 8), neckMat);
  neck.position.y = s.ey - s.hs*.5; g.add(neck);

  // Body
  const body = new THREE.Mesh(new THREE.CylinderGeometry(s.bs, s.bt, s.bh, 10), bodyMat);
  body.position.y = s.by; g.add(body);

  // Shoulders
  const shMat = bodyMat.clone(); shMat.opacity = .4;
  const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(s.rw*.8, s.rw, s.hs*.12, 10), shMat);
  shoulder.position.y = s.by + s.bh*.35; g.add(shoulder);

  // Robe (scalloped bottom effect using cone)
  const robeMat = bodyMat.clone();
  robeMat.opacity = .25; robeMat.emissiveIntensity = .12;
  const robe = new THREE.Mesh(new THREE.CylinderGeometry(s.rw, s.rt*1.3, s.rh, 12), robeMat);
  robe.position.y = s.ry; g.add(robe);

  // Robe overlay (wispy bottom)
  const robe2Mat = robeMat.clone(); robe2Mat.opacity = .1;
  const robe2 = new THREE.Mesh(new THREE.CylinderGeometry(s.rw*.7, s.rt*1.6, s.rh*.7, 10), robe2Mat);
  robe2.position.y = s.ry - s.rh*.15; g.add(robe2);

  // Arms
  const armMat = bodyMat.clone(); armMat.opacity = .45;
  const arms = [];
  const armSpread = s.rw * 0.9;
  [[-armSpread,s.ay,.3],[armSpread,s.ay,-.3]].forEach(([x, y, rz])=>{
    const a = new THREE.Mesh(new THREE.CylinderGeometry(s.as, s.as*.7, s.al, 6), armMat);
    a.position.set(x, y, 0); a.rotation.z = rz;
    g.add(a); arms.push(a);
  });

  // Ghostly tail (wisp)
  const tailMat = bodyMat.clone(); tailMat.opacity = .12;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(s.tw, s.th, 8), tailMat);
  tail.position.y = s.ty; tail.rotation.x = .1; g.add(tail);

  // Eyes (glowing with sclera)
  const eyeMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:.2});
  const pupilMat = new THREE.MeshStandardMaterial({color:0x111111});
  const eyeOff=s.hs*.28;
  const eyes = [];
  [[-eyeOff,s.ey+.02,s.hs*.88],[eyeOff,s.ey+.02,s.hs*.88]].forEach(([x,y,z])=>{
    const e = new THREE.Mesh(new THREE.SphereGeometry(s.hs*.13, 8, 8), eyeMat);
    e.position.set(x,y,z); g.add(e); eyes.push(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(s.hs*.07, 8, 8), pupilMat);
    p.position.set(x,y,z+s.hs*.08); g.add(p);
  });

  // Eyebrows
  const browMat = bodyMat.clone(); browMat.opacity = .6; browMat.emissiveIntensity = .1;
  [[-eyeOff*.7,s.ey+s.hs*.25,s.hs*.88],[eyeOff*.7,s.ey+s.hs*.25,s.hs*.88]].forEach(([x,y,z])=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(s.hs*.12, s.hs*.03, s.hs*.04), browMat);
    b.position.set(x,y,z); b.rotation.z = x<0?-.1:.1; g.add(b);
  });

  // Mouth (curved shape - more expressive)
  const mouthMat = new THREE.MeshStandardMaterial({color:0x446688, emissive:0x446688, emissiveIntensity:.08});
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(s.hs*.1, s.hs*.025, 6, 10), mouthMat);
  mouth.position.set(0, s.ey-s.hs*.2, s.hs*.9); mouth.rotation.x = .4; mouth.scale.y = .6;
  g.add(mouth);

  // Cheek blush
  const blushMat = new THREE.MeshStandardMaterial({color:c.clone().lerp(new THREE.Color(0xff8888),.3), transparent:true, opacity:.08});
  [[-s.hs*.5, s.ey-s.hs*.1, s.hs*.6],[s.hs*.5, s.ey-s.hs*.1, s.hs*.6]].forEach(([x,y,z])=>{
    const bl = new THREE.Mesh(new THREE.SphereGeometry(s.hs*.15, 6, 6), blushMat);
    bl.position.set(x,y,z); g.add(bl);
  });

  // === Soul-specific features based on path ===
  const pathFeatures = [];

  if (pathIdx === 0) { // 成仙 - golden halo
    const haloMat = new THREE.MeshStandardMaterial({color:0xffd700, emissive:0xffd700, emissiveIntensity:.15, transparent:true, opacity:.2, side:THREE.DoubleSide});
    const halo = new THREE.Mesh(new THREE.RingGeometry(s.hs*.6, s.hs*.8, 16), haloMat);
    halo.position.set(0, s.ey+s.hs*.4, -s.hs*.2); halo.rotation.x = Math.PI/2;
    g.add(halo); pathFeatures.push(halo);
  } else if (pathIdx === 2) { // 好战 - spiked shoulder
    const spikeMat = new THREE.MeshStandardMaterial({color:0xff7043, emissive:0xff7043, emissiveIntensity:.1});
    [-1,1].forEach(dir => {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(s.hs*.08, s.hs*.2, 6), spikeMat);
      spike.position.set(dir*s.rw*.85, s.ay+.08, 0); spike.rotation.z = dir*.3;
      g.add(spike); pathFeatures.push(spike);
    });
  } else if (pathIdx === 3) { // 畜牲 - pointed ears
    const earMat = bodyMat.clone(); earMat.opacity = .5;
    [-1,1].forEach(dir => {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(s.hs*.08, s.hs*.15, 6), earMat);
      ear.position.set(dir*s.hs*.5, s.ey+s.hs*.25, 0);
      ear.rotation.z = dir*.4; ear.rotation.x = .2;
      g.add(ear); pathFeatures.push(ear);
    });
  } else if (pathIdx === 4) { // 饿鬼 - longer thinner arms
    arms.forEach(a => { a.scale.set(1, 1.4, 1); a.position.y += .02; });
  } else if (pathIdx === 5) { // 地狱 - small horns
    const hornMat = new THREE.MeshStandardMaterial({color:0x440000, emissive:0x880000, emissiveIntensity:.05});
    [-1,1].forEach(dir => {
      const horn = new THREE.Mesh(new THREE.ConeGeometry(s.hs*.06, s.hs*.2, 6), hornMat);
      horn.position.set(dir*s.hs*.3, s.ey+s.hs*.3, -s.hs*.05);
      horn.rotation.x = dir*.3; g.add(horn); pathFeatures.push(horn);
    });
  }

  // Aura particles (tiny orbiting dots)
  const auraCount = 20;
  const auraGeo = new THREE.BufferGeometry();
  const auraPos = new Float32Array(auraCount * 3);
  const auraData = [];
  for (let i=0; i<auraCount; i++) {
    const angle = Math.random() * Math.PI*2;
    const radius = .3 + Math.random() * .4;
    const height = (Math.random()-.5) * .8;
    auraPos[i*3] = Math.cos(angle) * radius;
    auraPos[i*3+1] = .4 + height;
    auraPos[i*3+2] = Math.sin(angle) * radius;
    auraData.push({angle, radius, height, speed:.5+Math.random()*1, phase:Math.random()*10});
  }
  auraGeo.setAttribute('position', new THREE.BufferAttribute(auraPos, 3));
  const auraMat = new THREE.PointsMaterial({color:color, size:.015, transparent:true, opacity:.3, blending:THREE.AdditiveBlending});
  const auraPts = new THREE.Points(auraGeo, auraMat);
  g.add(auraPts);

  // Tailor scale
  const sizeScale=.85+Math.random()*.3;
  g.scale.set(sizeScale, sizeScale, sizeScale);

  // Outer glow (larger)
  const tex = makeGlowTex(c, .1);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  sprite.scale.set(2.5, 2.5, 1); sprite.position.y = s.ey*.5;
  g.add(sprite);

  // CSS2D speech bubble
  const bubbleDiv=document.createElement('div');
  bubbleDiv.className='soul-bubble';
  bubbleDiv.innerHTML='<div class="sb-text"></div><div class="sb-speaker"></div>';
  bubbleDiv.style.display='none';
  const bubbleObj=new CSS2DObject(bubbleDiv);
  bubbleObj.position.set(0,s.ey+1.2,0);
  g.add(bubbleObj);

  g.userData = { head, body, robe, robe2, neck, shoulder, arms, tail, mouth, sprite, eyes, bubbleDiv, bubbleObj, auraPts, auraData, pathFeatures };
  soulArms = arms;
  return g;
}

function spawnSoul(data) {
  if (soulGroup) { scene.remove(soulGroup); soulGroup = null; }
  const hue = [0.55, 0.3, 0.05, 0.08, 0.75, 0.0][data.correctPath] || 0.55;
  soulColor = new THREE.Color().setHSL(hue, 0.6, 0.5).getHex();
  const variant=Math.floor(Math.random()*12);
  soulGroup = createHumanoidSoul(soulColor, variant, data.correctPath);
  soulGroup.position.set(0, -2, 0);
  soulGroup.scale.set(.3, .3, .3);
  scene.add(soulGroup);
  currentSoul = data;
  soulDesire = Math.random()<.7 ? data.correctPath : (data.correctPath+2+Math.floor(Math.random()*4))%6;
  soulArrived = false;
  soulFloatPhase = 0;
  judgingMode = false;
  askedQuestions = [];
  autoTimer = 0;
  autoIdx = 0;
  skillEffects = [];
}

// ===== 技能特效 =====
let skillEffects = [];
let activeSkill = 0;
let skillUses = [3, 2, 1];

function useSkillOnSoul(soulData) {
  if (!soulGroup || !soulArrived || judgingMode) return;
  if (skillUses[activeSkill] <= 0) return;
  skillUses[activeSkill]--;
  updateSkillUI();

  const sData = SKILLS[activeSkill];
  const line = soulData.skill_reveal ? soulData.skill_reveal[activeSkill] : '哎哟！';
  showBubble(`"${line}"`, `被${sData.id}击中`);

  // Visual effect
  if (activeSkill === 0) { // 糯米 - white burst
    for (let i=0; i<12; i++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(.03, 6, 6),
        new THREE.MeshStandardMaterial({color:0xffeedd, emissive:0xffeedd, emissiveIntensity:.3}));
      p.position.copy(soulGroup.position);
      p.position.y += .4;
      p.userData = { vx:(Math.random()-.5)*.1, vy:Math.random()*.05, vz:(Math.random()-.5)*.1, life:1 };
      scene.add(p);
      skillEffects.push(p);
    }
  } else if (activeSkill === 1) { // 玉佩 - green glow
    const pulse = new THREE.Mesh(new THREE.SphereGeometry(.4, 12, 12),
      new THREE.MeshStandardMaterial({color:0x66dd88, emissive:0x66dd88, emissiveIntensity:.5, transparent:true, opacity:.3}));
    pulse.position.copy(soulGroup.position);
    pulse.position.y += .4;
    pulse.userData = { life:1, isPulse:true };
    scene.add(pulse);
    skillEffects.push(pulse);
  } else if (activeSkill === 2) { // 桃木剑 - red slash
    const slash = new THREE.Mesh(new THREE.BoxGeometry(.3, .01, .01),
      new THREE.MeshStandardMaterial({color:0xff4444, emissive:0xff4444, emissiveIntensity:.8, transparent:true, opacity:1}));
    slash.position.copy(soulGroup.position);
    slash.position.y += .4;
    slash.position.x += .2;
    slash.rotation.z = .5;
    slash.userData = { life:1, isSlash:true };
    scene.add(slash);
    skillEffects.push(slash);
    // Shake soul
    if (soulGroup) soulGroup.position.x += .05;
    setTimeout(() => { if (soulGroup) soulGroup.position.x = 0; }, 200);
  }

  speak(line, soulData.voicePitch, soulData.voiceRate);
  skillUsedCount++; soulSkillUseCount++;
  autoTimer = 0;
}

function updateSkillEffects() {
  for (let i=skillEffects.length-1; i>=0; i--) {
    const e = skillEffects[i];
    e.userData.life -= .02;
    if (e.userData.isPulse) {
      e.scale.setScalar(1 + (1-e.userData.life)*2);
      e.material.opacity = e.userData.life * .3;
    } else if (e.userData.isSlash) {
      e.position.x += .02;
      e.material.opacity = e.userData.life;
    } else {
      e.position.x += e.userData.vx;
      e.position.y += e.userData.vy;
      e.position.z += e.userData.vz;
      e.userData.vy -= .002;
      e.scale.setScalar(e.userData.life);
    }
    if (e.userData.life <= 0) {
      scene.remove(e);
      skillEffects.splice(i, 1);
    }
  }
}

function getLine(soul, key, v=0) {

function useDivinePower(soul) {
  const cost = 15;
  if (PROGRESS.balance < cost || !soul.concern || soul.concernDone) return;
  PROGRESS.balance -= cost;
  PROGRESS.wishes += 1;
  soul.concernDone = true;
  const title=getTitle(PROGRESS);
  const newUnlocks=title.unlocks.filter(u=>!PROGRESS.unlocked.includes(u));
  newUnlocks.forEach(u=>{PROGRESS.unlocked.push(u);});
  saveProgress(PROGRESS);
  const result = soul.concernResult || '已用神力为你完成了心愿';
  showBubble(`"${result}"`, `🔮 神力显灵 · ${soul.name}`);
  speak(result, soul.voicePitch, soul.voiceRate);
  updateUI();
  renderQButtons(soul, askedQuestions);
  autoTimer = 0;
}

function hideBubble() {

}
function showPanel() { document.getElementById('panel').classList.add('show'); }

  document.getElementById('soul-name').textContent = soul.name;

function renderQButtons(soul, asked) {
  const cont = document.getElementById('question-btns');
  const avail = Q_BTNS.filter(q => !asked.includes(q.key));
  let html = '';
  avail.forEach(q => { html += `<button data-key="${q.key}">${q.label}</button>`; });
  if (relationship === 'friend') html += `<button class="harsh" id="harsh-btn">😤 老朋友也得骂</button>`;
  if (relationship === 'enemy') html += `<button class="harsh" id="harsh-btn">👊 开怼！</button>`;
  if (soul.concern && PROGRESS.balance>=15 && !soul.concernDone && asked.includes('worry')) html += `<button id="divine-btn">🔮 运用神力</button>`;
  if (asked.length >= 2) html += `<button class="judge" id="judge-btn">⚖️ 送走</button>`;
  html += `<button class="voice-btn ${speechEnabled?'active':''}" id="voice-btn">🔊</button>`;
  cont.innerHTML = html;
  cont.querySelectorAll('button[data-key]').forEach(b => b.addEventListener('click',()=>askQuestion(soul,b.dataset.key)));
  const hb = document.getElementById('harsh-btn');
  if (hb) hb.addEventListener('click',()=>harshInteract(soul));
  const db = document.getElementById('divine-btn');
  if (db) db.addEventListener('click',()=>useDivinePower(soul));
  const jb = document.getElementById('judge-btn');
  if (jb) jb.addEventListener('click',()=>startJudging(soul));
  const vb = document.getElementById('voice-btn');
  if (vb) vb.addEventListener('click',()=>{speechEnabled=!speechEnabled;vb.classList.toggle('active');});
}

  updateSoulInfo(soul);

  relationship = soul.friend ? 'friend' : soul.enemy ? 'enemy' : soul.meangirl ? 'meangirl' : null;
  if (soul.friend) friendCount++;
  if (soul.enemy) enemyCount++;

function harshInteract(soul) {
  harshCount++;
  let line, label;
  if (soul.friend) {
    const r = Math.floor(Math.random()*3);
    line = ['你丫又给老子添麻烦！说吧这回又咋了？','行啊你小子，死了都不消停。赶紧说，别浪费时间。','老朋友归老朋友，进了我这就得照规矩来！坦白从宽！'][r];
    label = '你怼老朋友';
  } else if (soul.enemy) {
    const r = Math.floor(Math.random()*3);
    line = ['呵呵，没想到吧？风水轮流转！老实交代！','你也有今天！说！你那些破事我一清二楚！','别想糊弄我，你什么德行我不知道？从实招来！'][r];
    label = '你开怼仇人';
  } else return;

function askAQuestion(soul) {
  const unasked = Q_BTNS.filter(q => !askedQuestions.includes(q.key));
  if (unasked.length === 0) return;
  const pick = unasked[Math.floor(Math.random() * unasked.length)];
  askQuestion(soul, pick.key);
}

function askQuestion(soul, key) {
  let line = getLine(soul, key);
  if (key === 'self') {
    const want = PATHS[soulDesire].id;
    const deserve = PATHS[soul.correctPath].id;
    if (soulDesire === soul.correctPath) {
      line = `我知道我该去「${want}」，我心里是认的。`;
    } else {
      line = `我知道按规矩我该去「${deserve}」…但我心里想去「${want}」，大人您能成全我吗？`;
    }
  }
  if (key === 'worry') {
    const pref = ['唉…要说放心不下的，也就一件事：','其实我死了倒没什么，就是…','别的都还好，就是有件事一直惦记着：','说到遗愿，我就放心不下这个：','我一直憋着没说——'][Math.floor(Math.random()*5)];
    line = soul.concern ? `${pref}${soul.concern}` : '也没什么遗愿了…';
  }
  const labels = {'death':'怎么没的','good':'好事','bad':'干过啥','self':'自评','last':'遗言','worry':'遗愿'};
  showBubble(`"${line}"`, `${soul.name}的回答`);
  speak(line, soul.voicePitch, soul.voiceRate);
  if (!askedQuestions.includes(key)) askedQuestions.push(key);
  renderQButtons(soul, askedQuestions);
  autoTimer = 0;
}

let fireEyesActive = false;
function toggleFireEyes(soul) {
  fireEyesActive = !fireEyesActive;
  const el=document.getElementById('fire-eyes-overlay');
  if (!fireEyesActive) { el.classList.remove('show'); return; }
  const desire=PATHS[soulDesire].id;
  const deserved=PATHS[soul.correctPath].id;
  document.getElementById('fe-desire').textContent=`心愿：${desire}`;
  document.getElementById('fe-deserved').textContent=`应得：${deserved}`;
  document.getElementById('fe-hint').textContent = desire===deserved ? '心愿与应得一致' : '心愿与应得不符，可用冥币成全';
  el.classList.add('show');
}
function fulfillWish(soul,cost) {
  if (PROGRESS.balance<cost) return;
  PROGRESS.balance-=cost;
  const title=getTitle(PROGRESS);
  const newUnlocks=title.unlocks.filter(u=>!PROGRESS.unlocked.includes(u));
  newUnlocks.forEach(u=>{PROGRESS.unlocked.push(u);});
  saveProgress(PROGRESS);
  const fb=document.getElementById('feedback'); const main=document.getElementById('fb-main'); const sub=document.getElementById('fb-sub');
  main.textContent=`${soul.name} 心愿达成 ✨`;
  main.className='main tip';
  sub.textContent=`花费 ${cost} 冥币`;
  fb.classList.add('show');
  spawnCoin(cost);
  setTimeout(()=>{fb.classList.remove('show');},1500);
  // Auto-send to desire path
  fireEyesActive=false; document.getElementById('fire-eyes-overlay').classList.remove('show');
  updateUI();
  processJudgment(soul, soulDesire);
}

function startJudging(soul) {
  if (judgingMode) return;
  judgingMode = true;
  showBubble(`"${getLine(soul,'last')}"`, `${soul.name}的最后遗言`);
  const cont = document.getElementById('question-btns');
  cont.innerHTML = '';
  // 火眼金睛 button if unlocked
  const title=getTitle(PROGRESS);
  if (title.unlocks.includes('fire_eyes')) {
    const fBtn=document.createElement('button');
    fBtn.textContent='🔥 火眼金睛';
    fBtn.style.cssText='border-color:#ff6!important;color:#ff6!important';
    fBtn.onclick=()=>toggleFireEyes(soul);
    cont.appendChild(fBtn);
  }
  // 用冥币成全 button if soul has unmet desire
  const desire=PATHS[soulDesire].id;
  const deserved=PATHS[soul.correctPath].id;
  if (desire!==deserved && PROGRESS.balance>0) {
    const fBtn=document.createElement('button');
    fBtn.id='fulfill-btn';
    fBtn.textContent=`💰 用冥币成全（${desire}）`;
    const cost = soulSkillUseCount>0 ? 10 : 20;
    fBtn.onclick=()=>fulfillWish(soul,cost);
    cont.appendChild(fBtn);
  }
  document.getElementById('skill-hint').classList.remove('show');
  if (soulGroup && soulGroup.userData && soulGroup.userData.mouth) {
    soulGroup.userData.mouth.rotation.x = .5;
  }
}

// ===== 语音 =====
let speechEnabled = true;
function speak(text, pitch=1, rate=1) {
  if (!speechEnabled || !text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.pitch = pitch; u.rate = rate;
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.includes('zh'));
  if (zh) u.voice = zh;
  speechSynthesis.speak(u);
}
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

// ===== 冥币飞升 =====
function spawnCoin(amount) {
  const el = document.createElement('div');
  el.className = 'coin-fly';
  el.textContent = `💰 +${amount}`;
  el.style.left = '50%';
  el.style.top = '45%';
  el.style.transform = 'translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

// ===== 判定 =====
function judgeSoul(soul, pathIdx) {
  const selected = PATHS[pathIdx].id;
  const desire = PATHS[soulDesire].id;
  const deserved = PATHS[soul.correctPath].id;
  const honored = selected === desire;
  const just = selected === deserved;

  let satisfaction = 40;
  if (askedQuestions.length >= 3) satisfaction += 20;
  if (askedQuestions.length >= 5) satisfaction += 10;
  if (honored) satisfaction += 35;
  else if (just) satisfaction += 15;
  if (soulSkillUseCount > 0) satisfaction += 15;
  if (harshCount > 0 && relationship) satisfaction -= harshCount * 8;
  satisfaction -= autoTriggers * 10;

  const happy = satisfaction >= 60;
  const tip = happy ? Math.floor(10 + (satisfaction-60)/5) : 0;

  totalScore += tip;
  if (happy) happyCount++;
  // Handle persistent progression
  if (honored) PROGRESS.wishes+=1;
  if (tip>0) {
    PROGRESS.total冥币+=tip; PROGRESS.balance+=tip;
  }
  if (honored || tip>0) {
    const title=getTitle(PROGRESS);
    const newUnlocks=title.unlocks.filter(u=>!PROGRESS.unlocked.includes(u));
    newUnlocks.forEach(u=>{PROGRESS.unlocked.push(u);});
    if (honored && newUnlocks.length>0) {
      setTimeout(()=>{
        const sub=document.getElementById('fb-sub');
        sub.textContent+=` · 🔥 解锁 ${newUnlocks.map(u=>SPECIAL_SKILLS[u].name).join('、')}！`;
      }, 400);
    }
    saveProgress(PROGRESS);
  }

  return { honored, just, happy, tip, satisfaction, desire:desire, deserved };
}

let autoTriggers = 0;

function processJudgment(soul, pathIdx) {
  const result = judgeSoul(soul, pathIdx);
  const fb = document.getElementById('feedback');
  const main = document.getElementById('fb-main');
  const sub = document.getElementById('fb-sub');

  if (result.happy) {
    main.textContent = `${soul.name} 满意了 🙏`;
    main.className = 'main happy';
    sub.textContent = result.tip > 0 ? `打赏冥币 +${result.tip}` : '默默点头致谢';
    fb.classList.add('show');
    if (result.tip > 0) setTimeout(()=>spawnCoin(result.tip), 300);
  } else {
    main.textContent = `${soul.name} 不太满意 😞`;
    main.className = 'main sad';
    sub.textContent = `它想去「${result.desire}」`;
    fb.classList.add('show');
  }

  showBubble(`"${result.happy ? '谢大人！大人英明！' : result.honored ? '好吧…虽然不是最想去的地方，但您说了算。' : '呜…我想去的是「'+result.desire+'」啊…'}"`, soul.name);
  updateUI();
  hidePanel();

  // Hole effect + soul descend
  const idx = pathIdx;
  const h = holes[idx];
  h.glow.material.emissiveIntensity=1.5; h.beam.material.opacity=.4; h.beam2.material.opacity=.2;
  setTimeout(()=>{h.glow.material.emissiveIntensity=.5;h.beam.material.opacity=.12;h.beam2.material.opacity=.06;},600);
  h.pLight.intensity=1.5; setTimeout(()=>{h.pLight.intensity=.3;},600);

  // Animate soul descending into hole
  if (soulGroup) {
    const startY=soulGroup.position.y;
    const targetY=-0.3;
    const holePos=h.group.position.clone();
    const startPos=soulGroup.position.clone();
    const duration=800;
    const startTime=performance.now();
    function descendAnim() {
      const elapsed=performance.now()-startTime;
      const t=Math.min(elapsed/duration,1);
      const ease=1-Math.pow(1-t,3);
      soulGroup.position.x=startPos.x+(holePos.x-startPos.x)*ease;
      soulGroup.position.z=startPos.z+(holePos.z-startPos.z)*ease;
      soulGroup.position.y=startY+(targetY-startY)*ease;
      const s=1-ease*.8;
      soulGroup.scale.set(s,s,s);
      if (soulGroup.userData.sprite) soulGroup.userData.sprite.material.opacity=1-ease;
      if (t<1) requestAnimationFrame(descendAnim);
      else {
        scene.remove(soulGroup); soulGroup=null;
        currentSoulData=null;soulArrived=false;isAnimating=false;judgingMode=false;
        hideBubble();
        fb.classList.remove('show');
        document.getElementById('skill-hint').classList.add('show');
      nextSoul();
      }
    }
    descendAnim();
  } else {
    setTimeout(()=>{
      fb.classList.remove('show');
      currentSoulData=null;soulArrived=false;isAnimating=false;judgingMode=false;
      hideBubble();
      document.getElementById('skill-hint').classList.add('show');
      nextSoul();
    }, 1200);
  }
}

// ===== 游戏流程 =====
function nextSoul() {
  if (!isPlaying) return;
  soulNumber++;
  if (soulNumber > 5) {
    endGame();
    return;
  }
  document.getElementById('soul-num').textContent = soulNumber;
  // Never repeat until all souls seen
  if (soulIndex >= allSoulsQueue.length) {
    allSoulsQueue = [...SOULS].sort(()=>Math.random()-.5);
    soulIndex = 0;
  }
  const soul = allSoulsQueue[soulIndex];
  soulIndex++;
  autoTriggers = 0; soulSkillUseCount = 0; soul.concernDone = false;
  skillUses = [3, 2, 1];
  updateSkillUI();
  spawnSoul(soul);
  setTimeout(() => {
    // soul arrival triggers in animation loop
  }, 100);
}

function startGame() {
  totalScore=0; happyCount=0; skillUsedCount=0; soulNumber=0;
  harshCount=0; friendCount=0; enemyCount=0; relationship=null; fireEyesActive=false;
  document.getElementById('fire-eyes-overlay').classList.remove('show');
  PROGRESS=loadProgress(); updateTitleDisplay();
  isPlaying=true; isAnimating=false; soulArrived=false; judgingMode=false;
  currentSoulData=null; activeSkill=0;
  skillUses=[3,2,1];
  if (soulGroup) { scene.remove(soulGroup); soulGroup = null; }
  allSoulsQueue = [...SOULS].sort(()=>Math.random()-.5); soulIndex = 0;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('end-screen').classList.remove('visible');
  document.getElementById('score-val').textContent = '0';
  document.getElementById('soul-num').textContent = '0';
  document.getElementById('skill-hint').classList.add('show');
  //
  updateUI(); updateSkillUI();
  setTimeout(()=>nextSoul(), 800);
}

function endGame() {
  isPlaying = false;
  if (soulGroup) { scene.remove(soulGroup); soulGroup = null; }
  hideBubble(); hidePanel();
  document.getElementById('skill-hint').classList.remove('show');

  document.getElementById('final-score').textContent = totalScore;
  document.getElementById('final-happy').textContent = `${happyCount}/5`;
  document.getElementById('final-skills').textContent = skillUsedCount;

  let rank = '实习判官';
  if (totalScore>=80) rank='初级判官'; if (totalScore>=150) rank='资深判官';
  if (totalScore>=250) rank='轮回司主'; if (totalScore>=400) rank='十殿阎罗';
  document.getElementById('final-rank').textContent = `称号：${rank}`;

  const reviews = [];
  if (happyCount >= 4) reviews.push('亡灵们对你赞不绝口');
  else if (happyCount >= 2) reviews.push('大部分亡灵还算满意');
  else reviews.push('亡灵们颇有微词');
  if (harshCount > 0) {
    if (harshCount > 3) reviews.push('刻薄起来不是人');
    else reviews.push('嘴上不饶人');
  }
  if (friendCount > 0 && enemyCount > 0) reviews.push('熟人一个没放过');
  if (skillUsedCount >= 5) reviews.push('法器用得炉火纯青');
  else if (skillUsedCount >= 2) reviews.push('法器偶尔用用也不错');
  else reviews.push('下次试试用法器吧');
  const personality = harshCount > 0 ? '刻薄但公正的判官' : '温和但坚定的判官';
  reviews.push(`你是个${personality}`);
  document.getElementById('final-review').textContent = reviews.join(' · ');
  const title=getTitle(PROGRESS);
  document.getElementById('final-progress').textContent = `称号：${title.name} ｜ 累计成全 ${PROGRESS.wishes} 人 ｜ 冥币余额 ${PROGRESS.balance}`;
  updateTitleDisplay();

  document.getElementById('end-screen').classList.add('visible');
}

// ===== 技能 UI =====
function updateSkillUI() {
  for (let i=0; i<3; i++) {
    const el = document.querySelector(`.skill-item[data-skill="${i}"]`);
    if (!el) continue;
    el.classList.toggle('active', i === activeSkill);
    el.classList.toggle('used', skillUses[i] <= 0);
    el.querySelector('.count').textContent = `×${skillUses[i]}`;
  }
}

// ===== 键盘事件 =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E') {
    if (!isPlaying || judgingMode) return;
    // Cycle to next available skill
    for (let i=0; i<3; i++) {
      const next = (activeSkill + 1 + i) % 3;
      if (skillUses[next] > 0) { activeSkill = next; break; }
    }
    updateSkillUI();
    document.getElementById('skill-hint').textContent = `${SKILLS[activeSkill].icon} ${SKILLS[activeSkill].id} · ${SKILLS[activeSkill].desc}`;
    setTimeout(() => {
      if (!judgingMode) document.getElementById('skill-hint').textContent = '点击灵魂使用法器 · 按 E 切换';
    }, 2000);
  }
});

// ===== 点击灵魂使用技能 =====
renderer.domElement.addEventListener('click', (e) => {
  // Check if clicking on soul for skill use
  if (!isPlaying || judgingMode || !soulGroup || !soulArrived || !currentSoulData) return;
  if (skillUses[activeSkill] <= 0) return;

  raycaster.setFromCamera(mouse, camera);
  const soulMeshes = [];
  soulGroup.children.forEach(c => {
    if (c.isMesh || c.type === 'Mesh') soulMeshes.push(c);
  });
  const hits = raycaster.intersectObjects(soulMeshes, false);
  if (hits.length > 0) {
    useSkillOnSoul(currentSoulData);
  }
});

// ===== Hole click =====
renderer.domElement.addEventListener('click', (e) => {
  if (!isPlaying || isAnimating || !soulArrived || !currentSoulData || !judgingMode) return;
  const intersects = getHoleIntersects();
  if (!intersects.length) return;
  const hit = intersects[0].object;
  const idx = holes.findIndex(p => p.clickMesh === hit);
  if (idx === -1) return;

  isAnimating = true;
  processJudgment(currentSoulData, idx);
});

// ===== Raycaster =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function getHoleIntersects() {
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(holes.map(p => p.clickMesh));
}

// ===== UI 更新 =====
function updateUI() {
  document.getElementById('score-val').textContent = totalScore;
  const t=getTitle(PROGRESS);
  document.getElementById('title-tag').textContent = t.name;
  document.getElementById('balance-val').textContent = PROGRESS.balance;
}

// ===== 自动对话 =====
const AUTO_INTERVAL = 15;

function updateAutoDialogue(dt) {
  if (!isPlaying || !soulArrived || judgingMode || !currentSoul || askedQuestions.length === 0) return;
  autoTimer += dt;
  if (autoTimer >= AUTO_INTERVAL) {
    autoTimer = 0;
    autoIdx++;
    let line;
    // Occasionally mention concern
    if (autoIdx % 3 === 0 && currentSoul && currentSoul.concern) {
      line = `唉…${currentSoul.concern}`;
    } else {
      const lines = currentSoul.lines.auto;
      if (lines && lines.length > 0) line = lines[autoIdx % lines.length];
    }
    if (line) {
      showBubble(`"${line}"`, `${currentSoul.name}（自言自语）`, '');
      speak(line, currentSoul.voicePitch, currentSoul.voiceRate * 0.9);
      autoTriggers++;
    }
  }
}

// ===== 动画循环 =====
let animTime = 0;

function animate() {
  requestAnimationFrame(animate);
  animTime += 0.016;

  // Lanterns
  lanterns.forEach((l,i)=>{
    l.sprite.position.y+=Math.sin(animTime*l.speed+l.phase)*.003;
    l.sprite.rotation.y=animTime*.2+i;
  });

  // Waiting souls
  waitingSouls.forEach((w,i)=>{
    w.group.position.y=w.baseY+Math.sin(animTime*.8+w.phase)*.15;
    w.group.rotation.y=animTime*.05+i;
  });

  // Holes
  holes.forEach((p,i)=>{
    const pulse = .3 + Math.sin(animTime*1.2+i*1.8)*.15;
    p.glow.material.emissiveIntensity = pulse;
    p.beam.material.opacity = .08 + Math.sin(animTime*1.5+i*1.8)*.04;
    p.pLight.intensity = .2+Math.sin(animTime*1.5+i*1.8)*.12;
  });

  // Ambient particles
  const pos = ambientPts.geometry.attributes.position.array;
  for (let i=0; i<APC; i++) { pos[i*3+1] += .003*apSpd[i]; if (pos[i*3+1]>10) pos[i*3+1]=0; }
  ambientPts.geometry.attributes.position.needsUpdate = true;

  // Soul
  if (soulGroup) {
    soulFloatPhase += 0.016;
    const bob = Math.sin(soulFloatPhase * 2) * .05;
    const targetY = soulArrived ? 1.1 + bob : 1.1;
    soulGroup.position.y += (targetY - soulGroup.position.y) * .03;
    soulGroup.rotation.y += .006;
    soulGroup.position.x = Math.sin(soulFloatPhase * .35) * .06;

    const targetScale = soulArrived ? 1 : .3;
    const s = soulGroup.scale.x + (targetScale - soulGroup.scale.x) * .05;
    soulGroup.scale.set(s,s,s);

    // Breathing (body scale)
    const breathe = 1 + Math.sin(soulFloatPhase * 1.8) * .015;
    if (soulGroup.userData.body) soulGroup.userData.body.scale.y = breathe;
    if (soulGroup.userData.robe) soulGroup.userData.robe.scale.set(breathe, 1, breathe);
    if (soulGroup.userData.robe2) soulGroup.userData.robe2.scale.set(breathe*1.1, 1, breathe*1.1);

    // Arm sway
    if (soulArms) {
      soulArms.forEach((arm, i) => {
        if (arm) arm.rotation.z = (i===0?1:-1) * (.15 + Math.sin(soulFloatPhase * 1.5 + i) * .12);
      });
    }

    // Aura particle orbit
    if (soulGroup.userData.auraPts && soulGroup.userData.auraData) {
      const aPos = soulGroup.userData.auraPts.geometry.attributes.position.array;
      const aData = soulGroup.userData.auraData;
      for (let i=0; i<aData.length; i++) {
        const d = aData[i];
        const a = d.angle + soulFloatPhase * d.speed;
        aPos[i*3] = Math.cos(a) * d.radius;
        aPos[i*3+1] = .4 + d.height + Math.sin(soulFloatPhase * d.speed + d.phase) * .05;
        aPos[i*3+2] = Math.sin(a) * d.radius;
      }
      soulGroup.userData.auraPts.geometry.attributes.position.needsUpdate = true;
    }

    // Head tilt
    if (soulGroup.userData.head) {
      soulGroup.userData.head.rotation.z = Math.sin(soulFloatPhase * .8) * .03;
    }

    if (!soulArrived && soulGroup.position.y > 0.8) {
      soulArrived = true;
      currentSoulData = currentSoul;
      if (currentSoulData) soulEnter(currentSoulData);
    }
  }

  // Auto dialogue
  updateAutoDialogue(0.016);

  // Skill effects
  updateSkillEffects();

  // Hole hover
  const hIntersects = getHoleIntersects();
  holes.forEach(p => {
    const hovered = hIntersects.length > 0 && hIntersects[0].object === p.clickMesh;
    if (hovered !== p.hovered) {
      p.hovered = hovered;
      p.glow.material.emissiveIntensity = hovered ? 1.2 : .5;
      p.glow.material.opacity = hovered ? .9 : .6;
      p.label.element.style.color = hovered ? '#fff' : `#${new THREE.Color(p.data.color).getHexString()}`;
    }
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

});
